name: Build
permissions:
  contents: read
on:
  push:
    branches:
      - main
      - "*-dev"
    tags:
      - "[0-9]+.*"
  pull_request:
    branches:
      - main
env:
  # The nightly that lint uses for rustfmt and clippy. Keep it the same as the
  # toolchain in docs-site.yml and docs/smalldocs/_smalldocs.yml.
  NIGHTLY: nightly-2026-11-12
  EDITORCONFIG_CHECKER_VERSION: 4.0.2
  EDITORCONFIG_CHECKER_SHA256: 44efaef3ed14c6ab52eb87481d78e5e5c204796dccf26e2f4598a61ba17f8003
  MARKDOWNLINT_CLI2_VERSION: 0.24.1
  YAMLFMT_VERSION: v0.21.0
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
        with:
          toolchain: ${{ env.NIGHTLY }}
          components: clippy,rustfmt
          cargo-tools: cargo-sort@2.1.4 taplo-cli@0.10.0
      - name: Install editorconfig-checker and yamlfmt
        run: |
          curl -fsSL -o ec.tar.gz \
            "https://github.com/editorconfig-checker/editorconfig-checker/releases/download/v${EDITORCONFIG_CHECKER_VERSION}/editorconfig-checker-linux-amd64.tar.gz"
          echo "${EDITORCONFIG_CHECKER_SHA256}  ec.tar.gz" | sha256sum --check
          mkdir -p "$HOME/.local/bin"
          tar -xzf ec.tar.gz -C "$HOME/.local/bin" editorconfig-checker
          rm ec.tar.gz
          go install "github.com/google/yamlfmt/cmd/yamlfmt@${YAMLFMT_VERSION}"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      - name: Rust
        if: ${{ !cancelled() }}
        run: |
          cargo sort --workspace --check --config .config/tomlfmt.toml
          cargo +"$NIGHTLY" fmt --all --check -- --config-path .config/rustfmt.toml
          cargo +"$NIGHTLY" clippy --all-targets --all-features -- -D warnings
      - name: EditorConfig
        if: ${{ !cancelled() }}
        run: editorconfig-checker -config .config/editorconfig-checker.json
      - name: Markdown
        if: ${{ !cancelled() }}
        run: |
          npx --yes "markdownlint-cli2@${MARKDOWNLINT_CLI2_VERSION}" \
            --config .config/.markdownlint.yml "*.md" "**/*.md" \
            "#.agents" "#.cargo" "#coverage" "#.github/PULL_REQUEST_TEMPLATE.md" \
            "#target" "#tmp" "#**/node_modules"
      - name: TOML
        if: ${{ !cancelled() }}
        run: taplo lint --config .config/taplo.toml
      - name: YAML
        if: ${{ !cancelled() }}
        run: yamlfmt -lint -conf .config/.yamlfmt .
      - name: Web scripts
        if: ${{ !cancelled() }}
        run: |
          node tests/js/forms_preview.js templates/forms.js
          node tests/js/live_update_draft.js templates/live.js
  check:
    runs-on: ubuntu-latest
    steps:
      # The whole history and the tags, for just release-check.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: extractions/setup-just@v3
      - uses: astral-sh/setup-uv@v6
      - name: Check the release version against the tags and the commits
        run: just release-check
      - uses: ./.github/actions/setup
      - name: Check
        run: cargo check --workspace --all-targets --all-features
  test_unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
        with:
          components: llvm-tools-preview
          cargo-tools: cargo-llvm-cov@0.9.1 cargo-nextest@0.9.151
      - name: Unit Test
        run: cargo llvm-cov nextest --bin gest --summary-only --all-features --no-tests pass
  test_integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
        with:
          components: llvm-tools-preview
          cargo-tools: cargo-llvm-cov@0.9.1 cargo-nextest@0.9.151
      # tests/release.rs runs just and uv.
      - uses: extractions/setup-just@v3
      - uses: astral-sh/setup-uv@v6
      - name: Configure git identity
        run: |
          git config --global user.name "gest-ci"
          git config --global user.email "gest-ci@localhost"
      - name: Integration Test
        run: cargo llvm-cov nextest --test '*' --summary-only --all-features --no-tests pass
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - name: Build
        run: cargo build --workspace --all-features
  # On a push to main, after every check passed, tag the next release with just release. No agent runs here.
  release:
    needs: [lint, check, test_unit, test_integration, package]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    # One release at a time. A run on an older commit after a newer release prints no release.
    concurrency:
      group: release
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v6
      - uses: extractions/setup-just@v3
      - name: Name the author of the tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      - name: Tag the release
        run: just release
  # After the job release, build gest for four targets when HEAD has a release tag. A tag that the job release pushes
  # with the GITHUB_TOKEN starts no other workflow, so the build runs here. With no tag, each step after the checkout
  # is skipped, and the job passes. The Linux builds use musl, so the binary is static and runs on any distribution.
  binaries:
    needs: release
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    strategy:
      fail-fast: true
      matrix:
        include:
          - runner: macos-15
            target: aarch64-apple-darwin
          # GitHub retired macos-13 and deprecated macos-14, which no longer starts a job. The Intel build is a cross build.
          - runner: macos-15
            target: x86_64-apple-darwin
          - runner: ubuntu-24.04
            target: x86_64-unknown-linux-musl
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    env:
      CARGO_TERM_COLOR: never
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true
      - name: Find the release tag of HEAD
        id: tag
        run: echo "tag=$(git tag --points-at HEAD --sort=-v:refname --list 'v*' | head -n 1)" >> "$GITHUB_OUTPUT"
      - if: steps.tag.outputs.tag != ''
        uses: extractions/setup-just@v3
      - if: steps.tag.outputs.tag != ''
        uses: dtolnay/rust-toolchain@stable
      # libsql and ring build C code, which needs a musl C compiler for the static Linux builds.
      - name: Install the musl C compiler
        if: steps.tag.outputs.tag != '' && runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - name: Build and pack the binary
        if: steps.tag.outputs.tag != ''
        run: just dist ${{ matrix.target }}
      - name: Run the binary
        if: steps.tag.outputs.tag != '' && matrix.target != 'x86_64-apple-darwin'
        run: target/${{ matrix.target }}/release/gest --version
      # The runner cannot run the Intel binary, so check its architecture.
      - name: Check the Intel binary
        if: steps.tag.outputs.tag != '' && matrix.target == 'x86_64-apple-darwin'
        run: lipo -archs target/x86_64-apple-darwin/release/gest | grep -qx x86_64
      # file says "static-pie linked" for the x86_64 musl binary and "statically linked" for the arm64 one.
      - name: Check that the Linux binary is static
        if: steps.tag.outputs.tag != '' && runner.os == 'Linux'
        run: |
          file target/${{ matrix.target }}/release/gest
          file target/${{ matrix.target }}/release/gest | grep -Eq 'statically linked|static-pie linked'
      - if: steps.tag.outputs.tag != ''
        uses: actions/upload-artifact@v4
        with:
          name: gest-${{ matrix.target }}
          path: dist/
          if-no-files-found: error
  # Put the archives and their hashes on the GitHub release of the tag. This is the only job besides release that
  # can write. It makes the release from the message of the tag, or uploads to the release of the same tag.
  publish:
    needs: binaries
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true
      - name: Find the release tag of HEAD
        id: tag
        run: echo "tag=$(git tag --points-at HEAD --sort=-v:refname --list 'v*' | head -n 1)" >> "$GITHUB_OUTPUT"
      - if: steps.tag.outputs.tag != ''
        uses: actions/download-artifact@v4
        with:
          pattern: gest-*
          path: dist
          merge-multiple: true
      - name: Make the release or upload to it
        if: steps.tag.outputs.tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.tag.outputs.tag }}
        run: |-
          test "$(ls dist | wc -l)" -eq 8
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/* --clobber
          else
            gh release create "$TAG" dist/* --verify-tag --notes-from-tag
          fi
